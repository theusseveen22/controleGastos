<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplicativo gestor de gastos — Gestão</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0F1913;
    --bg-panel: #16241C;
    --bg-panel-2: #1B2B21;
    --line: #24382C;
    --ink: #EAF2EC;
    --ink-dim: #9DB3A5;
    --accent: #4ADE80;
    --accent-dim: #1F4A32;
    --saida: #F0885A;
    --saida-dim: #4A2A1B;
    --entrada: #4ADE80;
    --entrada-dim: #163B27;
    --error: #F0885A;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(74,222,128,0.07), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 32px 16px 60px;
  }

  .wrap{
    width:100%;
    max-width: 460px;
    margin: 0 auto;
  }

  .nav{
    display:flex;
    gap:4px;
    background: var(--bg-panel);
    border:1px solid var(--line);
    border-radius: 10px;
    padding:4px;
    margin-bottom:22px;
  }
  .nav a{
    flex:1;
    text-align:center;
    text-decoration:none;
    padding:9px 4px;
    border-radius:7px;
    font-size:11.5px;
    font-weight:600;
    color: var(--ink-dim);
    transition: all .15s ease;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .nav a.active{
    background: var(--accent);
    color:#0F1913;
  }
  .nav a:not(.active):hover{
    color: var(--ink);
  }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:6px; height:6px;
    background: var(--accent);
    border-radius:50%;
    box-shadow: 0 0 8px var(--accent);
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(24px, 5vw, 30px);
    line-height:1.15;
    margin: 0 0 28px 0;
    letter-spacing: -0.01em;
  }

  /* Card de saldo — o elemento de destaque da página */
  .saldo-card{
    background: linear-gradient(155deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 24px;
    text-align:center;
    margin-bottom: 16px;
    position:relative;
    overflow:hidden;
  }
  .saldo-card::before{
    content:'';
    position:absolute;
    top:-40%; right:-20%;
    width:220px; height:220px;
    background: radial-gradient(circle, rgba(74,222,128,0.12), transparent 70%);
    pointer-events:none;
  }
  .saldo-lbl{
    font-size:12px;
    font-weight:600;
    color: var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:10px;
  }
  .saldo-valor{
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(34px, 9vw, 44px);
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1;
  }
  .saldo-valor.positivo{ color: var(--entrada); }
  .saldo-valor.negativo{ color: var(--saida); }
  .saldo-formula{
    margin-top:10px;
    font-size:12.5px;
    color: var(--ink-dim);
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .box{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .box .icon-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .box .lbl{
    font-size: 12px;
    font-weight:600;
    color: var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .dot{
    width:8px; height:8px;
    border-radius:50%;
  }
  .box.entrada .dot{ background: var(--entrada); box-shadow: 0 0 8px var(--entrada); }
  .box.saida .dot{ background: var(--saida); box-shadow: 0 0 8px var(--saida); }

  .box .val{
    font-family:'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight:700;
  }
  .box.entrada .val{ color: var(--entrada); }
  .box.saida .val{ color: var(--saida); }

  .loading, .error-msg{
    text-align:center;
    color: var(--ink-dim);
    font-size:14px;
    padding: 40px 0;
  }
  .error-msg{ color: var(--error); }

  .refresh-btn{
    display:block;
    width:100%;
    margin-top: 16px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: var(--radius);
    padding: 12px 0;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 13.5px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .refresh-btn:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav">
    <a href="gestor-gastos.html">Novo</a>
    <a href="listar-lancamentos.html">Listagem</a>
    <a href="gestao.html" class="active">Gestão</a>
    <a href="limpar-mes.html">Limpar mês</a>
  </nav>

  <p class="eyebrow">Resumo do mês</p>
  <h1>Aplicativo gestor de gastos</h1>

  <div id="conteudo">
    <p class="loading">Carregando resumo...</p>
  </div>
</div>

<script>
  const API_URL = "http://localhost:8080/api/despesas";
  const conteudo = document.getElementById('conteudo');

  function formatarMoeda(v){
    return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }

  function render(dados){
    const saldo = Number(dados.entradaSubtraiSaida);
    const positivo = saldo >= 0;

    conteudo.innerHTML = `
      <div class="saldo-card">
        <div class="saldo-lbl">Saldo do mês</div>
        <div class="saldo-valor ${positivo ? 'positivo' : 'negativo'}">
          ${formatarMoeda(saldo)}
        </div>
        <div class="saldo-formula">Entradas − Saídas</div>
      </div>

      <div class="grid">
        <div class="box entrada">
          <div class="icon-row">
            <span class="lbl">Entradas</span>
            <span class="dot"></span>
          </div>
          <div class="val">${formatarMoeda(Number(dados.entrada))}</div>
        </div>
        <div class="box saida">
          <div class="icon-row">
            <span class="lbl">Saídas</span>
            <span class="dot"></span>
          </div>
          <div class="val">${formatarMoeda(Number(dados.saida))}</div>
        </div>
      </div>

      <button class="refresh-btn" id="btn-refresh">Atualizar resumo</button>
    `;

    document.getElementById('btn-refresh').addEventListener('click', carregar);
  }

  async function carregar(){
    conteudo.innerHTML = '<p class="loading">Carregando resumo...</p>';
    try{
      const resp = await fetch(API_URL);
      if(!resp.ok) throw new Error('Erro ' + resp.status);
      const dados = await resp.json();
      render(dados);
    }catch(err){
      conteudo.innerHTML = `<p class="error-msg">Falha ao carregar: ${err.message}</p>`;
    }
  }

  carregar();
</script>

</body>
</html>
