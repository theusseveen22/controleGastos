spring.application.name=controle-gastos
spring.profiles.active=local

# --- Configuração do Banco MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/controle_gastos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=devuser
spring.datasource.password=senha123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configurações do JPA / Hibernate ---
# 'update' cria/atualiza as tabelas automaticamente no MySQL sem apagar os dados antigos ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Exibe o SQL no terminal para acompanhamento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
